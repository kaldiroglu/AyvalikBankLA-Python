services:
  postgres:
    image: postgres:16
    container_name: ayvalikbank-la-python-postgres
    environment:
      POSTGRES_DB: ayvalikbank_la_python
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
