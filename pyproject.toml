[project]
name = "ayvalikbank-la"
version = "0.1.0"
description = "Layered banking application — Python port of AyvalikBankLA1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic[email]>=2.9",
  "email-validator>=2.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "bcrypt>=4.2",
  "greenlet>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
include = ["ayvalikbank_la*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
